<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <header>

        <h1>AI Resume Analyzer</h1>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <main class="hero">

        <div class="upload-box">

            <h2>Create Account</h2>

            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p id="registerMessage"></p>


            <p>
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 AI Resume Analyzer
        </p>

    </footer>
    


    <script src="js/auth.js"></script>

</body>

</html>
